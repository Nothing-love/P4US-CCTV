<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P4US CCTV – Login</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .tabs-login { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    .tab-login {
      flex: 1; background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--text-muted); cursor: pointer; padding: 10px 0; font-size: 13px;
      font-weight: 600; letter-spacing: .5px; transition: color .2s, border-color .2s;
    }
    .tab-login.active { color: var(--text); border-color: var(--accent); }
    .panel { display: none; }
    .panel.active { display: block; }
    .notice {
      background: rgba(212,160,23,.1); border: 1px solid var(--gold);
      border-radius: var(--radius); padding: 10px 14px;
      font-size: 12px; color: var(--gold); margin-top: 16px; text-align: center;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="/assets/Logo.jpeg" alt="P4US Logo" id="logo-img">
      <div>
        <div class="brand">P4US</div>
        <div class="sub">CCTV MONITORING</div>
      </div>
    </div>

    <div class="tabs-login">
      <button class="tab-login active" id="tab-btn-login">Masuk</button>
      <button class="tab-login" id="tab-btn-register">Daftar</button>
    </div>

    <!-- Login Panel -->
    <div id="panel-login" class="panel active">
      <div id="alert-login" class="alert" role="alert"></div>
      <form id="form-login" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="email" placeholder="email@domain.com" required>
        </div>
        <div class="form-group">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button type="submit" id="btn-login" class="btn-primary">MASUK</button>
      </form>
      <div class="notice">Akses hanya untuk pengguna yang telah diverifikasi admin.</div>
    </div>

    <!-- Register Panel -->
    <div id="panel-register" class="panel">
      <div id="alert-reg" class="alert" role="alert"></div>
      <form id="form-reg" novalidate>
        <div class="form-group">
          <label for="reg-name">Nama Lengkap</label>
          <input type="text" id="reg-name" placeholder="Nama Anda" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" autocomplete="email" placeholder="email@domain.com" required>
        </div>
        <div class="form-group">
          <label for="reg-pass">Password</label>
          <input type="password" id="reg-pass" autocomplete="new-password" placeholder="Min. 8 karakter" required minlength="8">
        </div>
        <button type="submit" id="btn-reg" class="btn-primary">DAFTAR</button>
      </form>
      <div class="notice">Pendaftaran perlu diverifikasi email lalu disetujui admin sebelum aktif.</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
